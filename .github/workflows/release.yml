name: Release

# Pushing a tag like v2.7.0 publishes a GitHub Release. Every site running the plugin
# then sees the update in Plugins → "Hay una nueva versión disponible".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' inpulsia-consent-bridge.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "define( 'ICB_VERSION'" inpulsia-consent-bridge.php | sed -E "s/.*'ICB_VERSION', '([^']+)'.*/\1/")
          echo "tag=$TAG header=$HEADER const=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::El tag ($TAG) no coincide con Version ($HEADER) / ICB_VERSION ($CONST)"
            exit 1
          fi

      - name: PHP lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Release notes from README changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="$TAG" '
            $0 ~ "^"v" " { on=1; print "## " $0; next }
            on && /^[0-9]+\.[0-9]+/ { exit }
            on && /^-{5,}/ { exit }
            on { if (sub(/^  · /, "- ") == 0) sub(/^    /, "  "); print }
          ' README.txt > notes.md
          [ -s notes.md ] || echo "Versión $TAG" > notes.md
          cat notes.md

      - name: Build installable ZIP (for manual installs)
        run: |
          mkdir -p build/inpulsia-consent-bridge
          git archive HEAD | tar -x -C build/inpulsia-consent-bridge
          (cd build && zip -rq ../inpulsia-consent-bridge.zip inpulsia-consent-bridge)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: inpulsia-consent-bridge.zip
